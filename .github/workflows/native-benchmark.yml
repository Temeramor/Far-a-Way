name: Native terrain benchmark

on:
  pull_request:
    branches: [main, update]
  push:
    branches: [main, update]
  workflow_dispatch:

jobs:
  windows-native-benchmark:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: python -m pip install scons

      - name: Build VoxEn GDExtension
        shell: pwsh
        run: |
          git clone --depth 1 --branch 10.0.0-stable https://github.com/godotengine/godot-cpp.git native/godot-cpp
          Push-Location native
          scons platform=windows target=template_debug arch=x86_64
          Pop-Location

      - name: Download Godot 4.7.2 editor
        shell: pwsh
        run: |
          $url = "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile godot-editor.zip
          Expand-Archive -Path godot-console.zip -DestinationPath godot-bin
          $exe = Get-ChildItem godot-bin -Filter "*win64.exe" -Recurse | Select-Object -First 1
          if ($null -eq $exe) { throw "Godot Windows editor executable was not found in the downloaded archive." }
          "GODOT_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Import project
        shell: pwsh
        run: |
          & "$env:GODOT_EXE" --headless --editor --path . --quit --log-file godot-import.log
          $exitCode = $LASTEXITCODE
          if (Test-Path godot-import.log) { Get-Content godot-import.log }
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Run smoke tests
        shell: pwsh
        run: |
          function Invoke-GodotTest([string]$scriptPath, [string]$logPath) {
            & "$env:GODOT_EXE" --headless --path . --script $scriptPath --log-file $logPath
            $exitCode = $LASTEXITCODE
            if (Test-Path $logPath) { Get-Content $logPath }
            if ($exitCode -ne 0) { exit $exitCode }
          }
          Invoke-GodotTest "res://tests/terrain_smoke_test.gd" "terrain-test.log"
          Invoke-GodotTest "res://tests/native_builder_smoke_test.gd" "native-builder-test.log"
          Invoke-GodotTest "res://tests/decoration_spatial_index_test.gd" "decor-index-test.log"
          Invoke-GodotTest "res://tests/lod_hierarchy_smoke_test.gd" "lod-test.log"
          Invoke-GodotTest "res://tests/shadow_lod_smoke_test.gd" "shadow-test.log"
          Invoke-GodotTest "res://tests/voxel_surface_scatter_smoke_test.gd" "scatter-test.log"

      - name: Restore LOD benchmark baseline
        uses: actions/cache/restore@v4
        with:
          path: .ci/native-chunk-benchmark-baseline.json
          key: voxen-chunk-baseline-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            voxen-chunk-baseline-${{ runner.os }}-${{ github.ref_name }}-
            voxen-chunk-baseline-${{ runner.os }}-main-

      - name: Run LOD benchmark
        shell: pwsh
        env:
          VOXEN_BENCHMARK_BASELINE_PATH: ${{ github.workspace }}/.ci/native-chunk-benchmark-baseline.json
        run: |
          New-Item -ItemType Directory -Force .ci | Out-Null
          & "$env:GODOT_EXE" --headless --path . --script res://tests/native_chunk_benchmark.gd --log-file native-benchmark.csv
          $exitCode = $LASTEXITCODE
          if (Test-Path native-benchmark.csv) { Get-Content native-benchmark.csv }
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Save LOD benchmark baseline
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .ci/native-chunk-benchmark-baseline.json
          key: voxen-chunk-baseline-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-terrain-benchmark
          path: native-benchmark.csv
          if-no-files-found: ignore
