name: Native terrain benchmark

on:
  pull_request:
    branches: [main, update]
  push:
    branches: [main, update]
  workflow_dispatch:

jobs:
  windows-native-benchmark:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: python -m pip install scons

      - name: Build VoxEn GDExtension
        shell: pwsh
        run: |
          git clone --depth 1 --branch 10.0.0-stable https://github.com/godotengine/godot-cpp.git native/godot-cpp
          Push-Location native
          scons platform=windows target=template_debug arch=x86_64
          Pop-Location

      - name: Download Godot 4.7.2 console
        shell: pwsh
        run: |
          $url = "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64_console.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile godot-console.zip
          Expand-Archive -Path godot-console.zip -DestinationPath godot-bin
          $exe = Get-ChildItem godot-bin -Filter "*console*.exe" -Recurse | Select-Object -First 1
          if ($null -eq $exe) { throw "Godot console executable was not found in the downloaded archive." }
          "GODOT_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Import project
        shell: pwsh
        run: '& "$env:GODOT_EXE" --headless --editor --path . --quit'

      - name: Run smoke tests
        shell: pwsh
        run: |
          & "$env:GODOT_EXE" --headless --path . --script res://tests/terrain_smoke_test.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:GODOT_EXE" --headless --path . --script res://tests/native_builder_smoke_test.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run LOD benchmark
        shell: pwsh
        run: |
          & "$env:GODOT_EXE" --headless --path . --script res://tests/native_chunk_benchmark.gd 2>&1 | Tee-Object -FilePath native-benchmark.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-terrain-benchmark
          path: native-benchmark.csv
          if-no-files-found: ignore
