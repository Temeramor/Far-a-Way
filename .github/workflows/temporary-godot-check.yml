name: Temporary Godot syntax validation for current branch
on:
  push:
    branches:
      - fix/distant-surface-ripple-shadows
    paths:
      - ".github/workflows/temporary-godot-check.yml"
permissions:
  contents: read
jobs:
  parse-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.2" -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
      - name: Import and parse project resources
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit
      - name: Load gameplay scene and compile its shader resources
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" res://scenes/world.tscn --quit-after 3
