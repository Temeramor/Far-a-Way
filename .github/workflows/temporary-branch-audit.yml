name: Temporary branch audit
on:
  push:
    branches:
      - fix/distant-surface-ripple-shadows
    paths:
      - ".github/workflows/temporary-branch-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.2" -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
      - name: Import resources and compile shader
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE" --quit
      - name: Run focused terrain and shadow test
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" -s res://tests/temporary_branch_audit_test.gd
