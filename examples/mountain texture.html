<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Процедурная текстура скалы</title>
<style>
:root{--bg:#f4f3ef;--fg:#1d1d1b;--mut:#6b6a64;--card:#fff;--bd:#d9d7cf;--ac:#b8651b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--fg:#ecebe6;--mut:#9a9890;--card:#222427;--bd:#38393c;--ac:#e39a55;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--fg:#ecebe6;--mut:#9a9890;--card:#222427;--bd:#38393c;--ac:#e39a55;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px;display:flex;flex-wrap:wrap;gap:16px}
h1{font-size:20px;margin:0 0 4px;width:100%}
.sub{color:var(--mut);margin:0 0 4px;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
#view{flex:2 1 420px;min-width:0}
#ctl{flex:1 1 260px}
.scroll{overflow:auto;max-width:100%;background:#000}
canvas{display:block;image-rendering:pixelated}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.row label{flex:0 0 108px;color:var(--mut)}
.row input[type=range]{flex:1;min-width:0}
.row output{flex:0 0 44px;text-align:right;font-variant-numeric:tabular-nums}
button{font:inherit;padding:6px 10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;cursor:pointer}
button:hover{border-color:var(--ac)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ruler{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--mut)}
#bar{height:6px;background:var(--fg);border:0;display:inline-block}
details{width:100%}pre{overflow:auto;max-height:420px;font-size:12px;line-height:1.4;margin:8px 0 0}
</style></head><body><main>
<h1>Процедурная пиксельная текстура скалы</h1>
<p class="sub">1 пиксель = 0,1 × 0,1 м. Текстура считается по мировым координатам, поэтому не повторяется и бесшовно стыкуется между чанками.</p>
<section id="view" class="card">
<div class="scroll"><canvas id="cv"></canvas></div>
<div class="ruler"><span id="bar"></span><span id="info"></span></div>
</section>
<section id="ctl" class="card">
<div class="presets" id="presets"></div>
<div id="sliders"></div>
<div class="row"><button id="rnd">Случайный seed</button></div>
</section>
<details class="card"><summary>Код генератора (JS)</summary>
<button id="cp" style="margin-top:8px">Копировать</button><pre id="code"></pre></details>
</main>

<script id="gen">
// ===== Генератор текстуры скалы =====
// generate(w, h, ox, oy, P) -> Uint8ClampedArray RGBA (w*h*4)
// ox, oy — мировые координаты левого верхнего пикселя (в пикселях, 1 px = 0.1 м).
// Соседние чанки с правильными ox/oy стыкуются без швов.
const RockGen = (() => {
  const sm = t => { t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); };
  const h2 = (x, y, s) => {
    let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 0x9E3779B1);
    h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296;
  };
  const vnoise = (x, y, s) => {
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    const a = h2(ix, iy, s), b = h2(ix + 1, iy, s), c = h2(ix, iy + 1, s), d = h2(ix + 1, iy + 1, s);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  const fbm = (x, y, s, o) => {
    let a = .5, f = 1, r = 0, n = 0;
    for (let i = 0; i < o; i++) { r += a * vnoise(x * f, y * f, s + i * 31); n += a; a *= .5; f *= 2.03; }
    return r / n;
  };
  const W = { f1: 0, f2: 0, cx: 0, cy: 0, dx: 0, dy: 0 };
  function worley(x, y, s) {
    const ix = Math.floor(x), iy = Math.floor(y);
    let f1 = 9, f2 = 9, bx = 0, by = 0, bdx = 0, bdy = 0;
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
      const cx = ix + i, cy = iy + j;
      const dx = x - (cx + h2(cx, cy, s)), dy = y - (cy + h2(cx, cy, s + 77));
      const d = dx * dx + dy * dy;
      if (d < f1) { f2 = f1; f1 = d; bx = cx; by = cy; bdx = dx; bdy = dy; } else if (d < f2) f2 = d;
    }
    W.f1 = Math.sqrt(f1); W.f2 = Math.sqrt(f2); W.cx = bx; W.cy = by; W.dx = bdx; W.dy = bdy;
  }
  // высота, дополнительное затемнение, оттенок блока
  function sample(X, Y, P, s, o) {
    const wx = X + (fbm(X * .018, Y * .018, s + 1, 3) - .5) * 34;
    const wy = Y + (fbm(X * .018 + 50, Y * .018 + 50, s + 2, 3) - .5) * 34;
    // крупные глыбы: ячейки Вороного, у каждой своя наклонная грань, между ними трещины
    worley(wx / 26, wy / 34, s + 3);
    const e = W.f2 - W.f1, crack = 1 - sm(e / .14);
    const id = h2(W.cx, W.cy, s + 4), fa = h2(W.cx, W.cy, s + 5) - .5, fb = h2(W.cx, W.cy, s + 6) - .5;
    const block = id * .5 + (W.dx * fa + W.dy * fb) * 1.6 - crack * .55 + sm(e / .5) * .25;
    // сколы и выбоины помельче
    worley(wx / 7.5, wy / 8, s + 9);
    const e2 = W.f2 - W.f1;
    const chip = (h2(W.cx, W.cy, s + 10) - .5) * .3 - (1 - sm(e2 / .2)) * .25;
    // вертикальные борозды (эрозионные желоба), вытянутый по Y шум
    const warp = fbm(wx * .05, wy * .02, s + 11, 2) * 3;
    const u = fbm(wx * .12 + warp, wy * .03, s + 12, 3);
    const u2 = vnoise(wx * .4 + warp * 2, wy * .05, s + 14);
    const flute = (1 - Math.abs(u * 2 - 1)) * .6 + (1 - Math.abs(u2 * 2 - 1)) * .2;
    const grain = vnoise(X * .9, Y * .9, s + 13) - .5;
    o.h = P.blocks * block + P.flutes * flute + P.chips * chip + grain * .12;
    // вертикальные тёмные потёки + крупные пятна яркости
    const streak = sm((fbm(X * .2, Y * .012, s + 20, 3) - .5) / .18);
    const macro = fbm(X * .01, Y * .01, s + 21, 3) - .5;
    o.d = crack * .2 * P.blocks + streak * P.streaks * .3 - macro * .3;
    o.t = id;
  }
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);
  const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  const ROCK = ['#101214', '#23262a', '#3c4044', '#5e6266', '#8b8e90', '#b9bbba', '#e2e2de'].map(hex);
  const MOSS = ['#1d2412', '#3a4219', '#5f6521', '#8a7f2c', '#b79a3a', '#d3b957'].map(hex);
  const ramp = (R, q) => {
    const p = q * (R.length - 1), i = Math.min(R.length - 2, Math.floor(p)), f = p - i;
    return [0, 1, 2].map(k => R[i][k] + (R[i + 1][k] - R[i][k]) * f);
  };
  function generate(w, h, ox, oy, P) {
    const m = 2, W2 = w + 2 * m, H2 = h + 2 * m, s = P.seed * 131 + 7;
    const H = new Float32Array(W2 * H2), D = new Float32Array(W2 * H2), T = new Float32Array(W2 * H2), o = {};
    for (let y = 0; y < H2; y++) for (let x = 0; x < W2; x++) {
      sample(x - m + ox, y - m + oy, P, s, o);
      const i = y * W2 + x; H[i] = o.h; D[i] = o.d; T[i] = o.t;
    }
    const out = new Uint8ClampedArray(w * h * 4), k = P.relief, lv = P.levels;
    let Lx = -.55, Ly = -.65, Lz = .52; const ln = Math.hypot(Lx, Ly, Lz); Lx /= ln; Ly /= ln; Lz /= ln;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = (y + m) * W2 + x + m;
      const dx = (H[i + 1] - H[i - 1]) / 2, dy = (H[i + W2] - H[i - W2]) / 2;
      const nx = -k * dx, ny = -k * dy, inv = 1 / Math.hypot(nx, ny, 1);
      const diff = (nx * Lx + ny * Ly + Lz) * inv;
      let sum = 0;
      for (let j = -2; j <= 2; j++) for (let l = -2; l <= 2; l++) sum += H[i + j * W2 + l];
      const cav = H[i] - sum / 25;                         // впадина < 0, выступ > 0
      let v = .52 + (diff - Lz) * 1.3 + Math.max(-.3, Math.min(.3, cav * .8)) - D[i];
      v = (v - .5) * P.contrast + .5;
      const X = x + ox, Y = y + oy;
      const t = v * (lv - 1) + (BAYER[(Y & 3) * 4 + (X & 3)] - .5) * P.dither;
      const q = Math.max(0, Math.min(lv - 1, Math.round(t))) / (lv - 1);
      const moss = P.moss > 0 && fbm(X * .045, Y * .045, s + 30, 3) > .72 - P.moss * .3 && cav < .05;
      let c;
      if (moss) c = ramp(MOSS, q);
      else { c = ramp(ROCK, q); const tn = (T[i] - .5) * 16; c[0] += tn; c[2] -= tn; }
      const p = (y * w + x) * 4; out[p] = c[0]; out[p + 1] = c[1]; out[p + 2] = c[2]; out[p + 3] = 255;
    }
    return out;
  }
  return { generate };
})();
</script>

<script>
const defs = [
  ['seed','Seed',0,9999,1,12],['size','Размер, px',64,384,32,256],['zoom','Масштаб экрана',1,6,1,3],
  ['ox','Сдвиг X, м',-500,500,1,0],['oy','Сдвиг Y, м',-500,500,1,0],
  ['blocks','Глыбы / трещины',0,1.5,.05,.6],['flutes','Вертик. борозды',0,1.5,.05,.6],['chips','Сколы',0,1.5,.05,.7],
  ['streaks','Тёмные потёки',0,1.5,.05,.6],['moss','Трава / лишайник',0,1,.05,0],
  ['relief','Рельеф (свет)',1,10,.5,4],['contrast','Контраст',.6,1.8,.05,1.1],
  ['levels','Уровней яркости',4,24,1,10],['dither','Дизеринг',0,1,.05,.5]
];
const P = {}, els = {};
const box = document.getElementById('sliders');
defs.forEach(([k, l, mn, mx, st, v]) => {
  P[k] = v;
  const r = document.createElement('div'); r.className = 'row';
  r.innerHTML = '<label>' + l + '</label><input type="range" min="' + mn + '" max="' + mx + '" step="' + st + '" value="' + v + '"><output>' + v + '</output>';
  const inp = r.querySelector('input'), out = r.querySelector('output');
  inp.addEventListener('input', () => { P[k] = +inp.value; out.textContent = inp.value; schedule(); });
  els[k] = [inp, out]; box.appendChild(r);
});
const set = o => { for (const k in o) { P[k] = o[k]; els[k][0].value = o[k]; els[k][1].textContent = o[k]; } schedule(); };
const presets = {
  'Рифлёная стена (фото 2)': { blocks: .25, flutes: 1.1, chips: .6, streaks: .9, moss: 0, relief: 4, contrast: 1.1 },
  'Глыбы и осыпи (фото 1)': { blocks: 1.1, flutes: .25, chips: .8, streaks: .4, moss: .45, relief: 4.5, contrast: 1.2 },
  'Смесь': { blocks: .6, flutes: .6, chips: .7, streaks: .6, moss: .1, relief: 4, contrast: 1.1 }
};
const pb = document.getElementById('presets');
for (const n in presets) { const b = document.createElement('button'); b.textContent = n; b.onclick = () => set(presets[n]); pb.appendChild(b); }
document.getElementById('rnd').onclick = () => set({ seed: Math.floor(Math.random() * 9999) });

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let pend = false;
function schedule() { if (!pend) { pend = true; requestAnimationFrame(draw); } }
function draw() {
  pend = false;
  const n = P.size, t0 = performance.now();
  const data = RockGen.generate(n, n, Math.round(P.ox * 10), Math.round(P.oy * 10), P);
  cv.width = n; cv.height = n;
  ctx.putImageData(new ImageData(data, n, n), 0, 0);
  cv.style.width = n * P.zoom + 'px'; cv.style.height = n * P.zoom + 'px';
  document.getElementById('bar').style.width = 10 * P.zoom + 'px';
  document.getElementById('info').textContent = '= 1 м (10 px) · ' + n + '×' + n + ' px = ' + (n / 10).toFixed(1) + '×' + (n / 10).toFixed(1) + ' м · ' + Math.round(performance.now() - t0) + ' мс';
}
set(presets['Смесь']);
document.getElementById('code').textContent = document.getElementById('gen').textContent.trim();
document.getElementById('cp').onclick = async e => {
  try { await navigator.clipboard.writeText(document.getElementById('code').textContent); e.target.textContent = 'Скопировано'; }
  catch (_) { const r = document.createRange(); r.selectNodeContents(document.getElementById('code')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); e.target.textContent = 'Выделено, нажмите Ctrl+C'; }
};
</script></body></html>
